site:
  name: "みてコス"
  url: "https://mitekosu.com"
  description: "人気コスメをレビュー件数・評価・価格で自動比較。毎日更新。"
  affiliate_note: "当サイトはアフィリエイト広告を利用しています。"
  operator: "みてコス運営"
  contact: "お問い合わせはサイト内フォーム（contact.html）から"
  # Googleフォームの「埋め込み用URL」を設定すると contact.html にフォームが埋め込まれる
  # 例: https://docs.google.com/forms/d/e/1FAIpQLSxxxxx/viewform?embedded=true
  contact_form_url: "https://docs.google.com/forms/d/e/1FAIpQLSdp85o6JUXjSgb42Ha2B8pY3E5Q7Ya5kfHRpz8zORqwZRHLVg/viewform?embedded=true"
  contact_form_height: 951  # Googleフォームの埋め込みコードのheight
  contact_email: ""   # 任意。設定すると mailto 導線も表示

# 表示課金広告 (貼るだけで閲覧連動収益)。ID設定後に自動挿入。未設定は非表示
ads:
  adsense_client: "ca-pub-4323706980092633"   # AdSense審査用コード (headに自動挿入)
  adsense_slot_top: "" # トップ・カテゴリ用スロットID
  adsense_slot_article: ""  # 商品詳細用スロットID

# 楽天ジャンルID: 100939 = 美容・コスメ・香水
rakuten:
  genre_id: "100939"
  hits_per_keyword: 30
  sort: "standard"  # 新APIでは +reviewCount がレビュー欠落を起こすため standard 推奨 (standard/+reviewAverage は可)
  min_review_count: 10
  min_review_average: 3.5
  # 件数が少ないカテゴリの救済: プチプラ系は緩和条件で追加取得
  petit_min_review_count: 5
  petit_min_review_average: 3.0

# 表示カテゴリは keywords のまま。取得だけ水増ししたい場合ここに列挙
# 例: "リップ 保湿 プチプラ" で検索しても4件しか無いので、別クエリの結果も同じラベルで統合する
extra_queries:
  "リップ 保湿 プチプラ":
    - "リップ プチプラ"
    - "口紅 プチプラ"
    - "リップクリーム プチプラ"
    - "リップティント プチプラ"

keywords:
  - 化粧水 敏感肌
  - 美容液 ビタミンC
  - クレンジング 毛穴
  - 日焼け止め 敏感肌
  - リップ 保湿 プチプラ
  - ファンデーション カバー力
  - シャンプー サロン
  - ハンドクリーム 保湿

amazon:
  enabled: true
  # PA-APIがなくても検索リンクで代替するのでサイトは止まらない
  fallback_search: true
  min_price: 500
  max_price: 20000

site_gen:
  top_n: 50
  output_dir: "public"
  # 代り映え対策: 高評価プールから日替わりランダムで表示
  high_rating_min_avg: 4.0
  high_rating_min_count: 10
  daily_pick_per_category: 5
  daily_pick_top: 8
  # 独自コンテンツ (選び方ガイド/FAQ/編集コラム) と絞り込みUIの切り替え
  guide_enabled: true
  filter_enabled: true
  editorial_columns: 8

sns:
  # アフィリ投稿 1日7件 (時間分散: 朝2/昼1/夕方2/夜2 の目安)
  max_posts_per_day: 7
  # アフィリとは別に「普通の投稿(PRなし)」を1日2件追加する
  chat_posts_per_day: 2
  # 代り映え対策: 商品候補を全件から選び、カテゴリをローテーションする
  affiliate_history_days: 10      # 直近この日数で投稿した商品は除外 (sns/*.md で管理)
  affiliate_min_review_count: 10  # これ未満のレビュー数は候補外
  affiliate_top_ratio: 0.7        # カテゴリ内上位◯割を中心に抽選 (残りも低確率で当たる)
  hashtags:
    - "#コスメ #プチプラ #美容垢さんと繋がりたい"
    - "#プチプラコスメ #スキンケア #コスメ好き"
    - "#美容 #コスメ好きな人と繋がりたい #スキンケア好き"
    - "#美容好きな人と繋がりたい #コスメ情報 #お得情報"
    - "#むだなく買う #プチプラ美容 #口コミで選ぶ"
  # 日常つぶやき用 (アフィリ用より軽め。空にしたい日は rate を 0 に)
  chat_hashtags:
    - "#スキンケア #美容垢さんと繋がりたい"
    - "#コスメ好きな人と繋がりたい #プチプラコスメ"
    - "#美容 #スキンケア好きな人と繋がりたい"
  chat_hashtag_rate: 0.6
