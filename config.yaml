site:
  name: "みてコス"
  url: "https://example.com"
  description: "人気コスメをレビュー件数・評価・価格で自動比較。毎日更新。"
  affiliate_note: "当サイトはアフィリエイト広告を利用しています。"
  operator: "みてコス運営"
  contact: "お問い合わせはX(@mitekosu 予定)または後日設置のフォームまで"

# 表示課金広告 (貼るだけで閲覧連動収益)。ID設定後に自動挿入。未設定は非表示
ads:
  adsense_client: ""   # 例: ca-pub-1234567890123456 (AdSense審査通過後に設定)
  adsense_slot_top: "" # トップ・カテゴリ用スロットID
  adsense_slot_article: ""  # 商品詳細用スロットID

# 楽天ジャンルID: 100939 = 美容・コスメ・香水
rakuten:
  genre_id: "100939"
  hits_per_keyword: 30
  sort: "standard"  # 新APIでは +reviewCount がレビュー欠落を起こすため standard 推奨 (standard/+reviewAverage は可)
  min_review_count: 10
  min_review_average: 3.5
  # 件数が少ないカテゴリの救済: プチプラ系は緩和条件で追加取得
  petit_min_review_count: 5
  petit_min_review_average: 3.0

# 表示カテゴリは keywords のまま。取得だけ水増ししたい場合ここに列挙
# 例: "リップ 保湿 プチプラ" で検索しても4件しか無いので、別クエリの結果も同じラベルで統合する
extra_queries:
  "リップ 保湿 プチプラ":
    - "リップ プチプラ"
    - "口紅 プチプラ"
    - "リップクリーム プチプラ"
    - "リップティント プチプラ"

keywords:
  - 化粧水 敏感肌
  - 美容液 ビタミンC
  - クレンジング 毛穴
  - 日焼け止め 敏感肌
  - リップ 保湿 プチプラ
  - ファンデーション カバー力
  - シャンプー サロン
  - ハンドクリーム 保湿

amazon:
  enabled: true
  # PA-APIがなくても検索リンクで代替するのでサイトは止まらない
  fallback_search: true
  min_price: 500
  max_price: 20000

site_gen:
  top_n: 50
  output_dir: "public"
  # 代り映え対策: 高評価プールから日替わりランダムで表示
  high_rating_min_avg: 4.0
  high_rating_min_count: 10
  daily_pick_per_category: 5
  daily_pick_top: 8

sns:
  # X無料枠(月1500件)を考慮して1日3件まで
  max_posts_per_day: 3
  hashtags: "#コスメ #プチプラ #美容垢さんと繋がりたい"
